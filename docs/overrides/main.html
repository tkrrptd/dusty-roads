{% extends "base.html" %}

{% block extrahead %}
  {{ super() }}

  <meta name="google-site-verification" content="A0qMiQcPpJx6PvT2qT-BSxOHcoYOmsGu-Fg3R0Rz89Y" />
  <meta name="msvalidate.01" content="82971E846C817BC57121DD3F8615E40E" />

  <script>
    document.documentElement.setAttribute('data-md-color-scheme', 'slate');

    document.addEventListener("DOMContentLoaded", function () {
      document.querySelectorAll('a[href^="http"]').forEach(link => {
        link.setAttribute("target", "_blank");
        link.setAttribute("rel", "noopener noreferrer");
      });
    });
  </script>
{% endblock %}
